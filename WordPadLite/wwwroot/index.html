<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>無題 — WordPad Lite</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body data-theme="system">
  <!-- Fluent / Word 風アイコン スプライト -->
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-file" viewBox="0 0 24 24">
      <path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/>
    </symbol>
    <symbol id="i-save" viewBox="0 0 24 24">
      <path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h7V3"/><path d="M8 21v-7h8v7"/>
    </symbol>
    <symbol id="i-save-as" viewBox="0 0 24 24">
      <path d="M5 3h10l3 3v9"/><path d="M8 3v6h6V3"/><path d="M5 21v-7h7v7"/>
      <path d="m15 18 2-2 4 4-2 2h-4z"/>
    </symbol>
    <symbol id="i-undo" viewBox="0 0 24 24">
      <path d="M9 7H4v5"/><path d="M4 12c3-5 8-7 13-4 3 2 4 5 3 8"/>
    </symbol>
    <symbol id="i-redo" viewBox="0 0 24 24">
      <path d="M15 7h5v5"/><path d="M20 12c-3-5-8-7-13-4-3 2-4 5-3 8"/>
    </symbol>
    <symbol id="i-cut" viewBox="0 0 24 24">
      <circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>
      <path d="M8 16 18 4M16 16 6 4"/>
    </symbol>
    <symbol id="i-copy" viewBox="0 0 24 24">
      <rect x="8" y="8" width="11" height="12" rx="1"/><path d="M5 16V5h9"/>
    </symbol>
    <symbol id="i-paste" viewBox="0 0 24 24">
      <path d="M8 4h8v3H8z"/><rect x="5" y="6" width="14" height="15" rx="1"/>
      <path d="M8 11h8M8 15h8M8 19h5"/>
    </symbol>
    <symbol id="i-bold" viewBox="0 0 24 24">
      <text x="12" y="18" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="currentColor" stroke="none">B</text>
    </symbol>
    <symbol id="i-italic" viewBox="0 0 24 24">
      <text x="12" y="18" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-style="italic" fill="currentColor" stroke="none">I</text>
    </symbol>
    <symbol id="i-underline" viewBox="0 0 24 24">
      <text x="12" y="17" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="currentColor" stroke="none">U</text>
      <path d="M7 20h10"/>
    </symbol>
    <symbol id="i-strike" viewBox="0 0 24 24">
      <text x="12" y="17" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="currentColor" stroke="none">S</text>
      <path d="M5 12h14"/>
    </symbol>
    <symbol id="i-font-color" viewBox="0 0 24 24">
      <path d="M5 17 10 5h2l5 12M7 13h7"/><path d="M4 21h16" stroke-width="3"/>
    </symbol>
    <symbol id="i-highlight" viewBox="0 0 24 24">
      <path d="M4 20h16"/><path d="m6 16 10-10 3 3-10 10z"/><path d="m5 15 4 4"/>
    </symbol>
    <symbol id="i-eraser" viewBox="0 0 24 24">
      <path d="m4 17 9-9 5 5-9 9z"/><path d="M9 8 15 2l6 6-6 6"/><path d="M4 21h16"/>
    </symbol>
    <symbol id="i-align-left" viewBox="0 0 24 24">
      <path d="M4 6h16M4 10h11M4 14h16M4 18h9"/>
    </symbol>
    <symbol id="i-align-center" viewBox="0 0 24 24">
      <path d="M4 6h16M6 10h12M4 14h16M7 18h10"/>
    </symbol>
    <symbol id="i-align-right" viewBox="0 0 24 24">
      <path d="M4 6h16M9 10h11M4 14h16M11 18h9"/>
    </symbol>
    <symbol id="i-align-justify" viewBox="0 0 24 24">
      <path d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
    </symbol>
    <symbol id="i-line-spacing" viewBox="0 0 24 24">
      <path d="M4 6h9M4 12h9M4 18h9"/><path d="M17 5v14"/>
      <path d="m14 8 3-3 3 3M14 16l3 3 3-3"/>
    </symbol>
    <symbol id="i-bullets" viewBox="0 0 24 24">
      <circle cx="5" cy="6" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="5" cy="18" r="1"/>
      <path d="M9 6h11M9 12h11M9 18h11"/>
    </symbol>
    <symbol id="i-numbering" viewBox="0 0 24 24">
      <path d="M4 5h2v4M4 9h3M4 14h3v2H4v2h3"/><path d="M10 6h10M10 12h10M10 18h10"/>
    </symbol>
    <symbol id="i-indent" viewBox="0 0 24 24">
      <path d="M4 6h16M4 18h16M10 10h10M10 14h10"/><path d="m4 10 4 2-4 2"/>
    </symbol>
    <symbol id="i-outdent" viewBox="0 0 24 24">
      <path d="M4 6h16M4 18h16M10 10h10M10 14h10"/><path d="m8 10-4 2 4 2"/>
    </symbol>
    <symbol id="i-image" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8" cy="10" r="1.5"/>
      <path d="m5 18 5-6 4 4 3-3 4 5"/>
    </symbol>
    <symbol id="i-table" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 10h18M3 15h18M10 5v14M15 5v14"/>
    </symbol>
    <symbol id="i-link" viewBox="0 0 24 24">
      <path d="M10 13a4 4 0 0 0 5.7 0l2.3-2.3a4 4 0 0 0-5.7-5.7L11 6.3"/>
      <path d="M14 11a4 4 0 0 0-5.7 0l-2.3 2.3a4 4 0 0 0 5.7 5.7l1.3-1.3"/>
    </symbol>
    <symbol id="i-page-break" viewBox="0 0 24 24">
      <path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M4 15h16" stroke-dasharray="2 2"/>
    </symbol>
    <symbol id="i-blank-page" viewBox="0 0 24 24">
      <path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M12 11v6M9 14h6"/>
    </symbol>
    <symbol id="i-read" viewBox="0 0 24 24">
      <path d="M4 5c3 0 5 1 8 3 3-2 5-3 8-3v14c-3 0-5 1-8 3-3-2-5-3-8-3z"/><path d="M12 8v14"/>
    </symbol>
    <symbol id="i-ruler" viewBox="0 0 24 24">
      <rect x="3" y="8" width="18" height="8" rx="1"/><path d="M6 8v3M9 8v4M12 8v3M15 8v4M18 8v3"/>
    </symbol>
    <symbol id="i-marks" viewBox="0 0 24 24">
      <path d="M8 5h7v14M8 12h7M8 5v14"/>
    </symbol>
    <symbol id="i-zoom-in" viewBox="0 0 24 24">
      <circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5M8 10.5h5M10.5 8v5"/>
    </symbol>
    <symbol id="i-zoom-out" viewBox="0 0 24 24">
      <circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5M8 10.5h5"/>
    </symbol>
    <symbol id="i-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24">
      <path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/>
    </symbol>
    <symbol id="i-share" viewBox="0 0 24 24">
      <circle cx="6" cy="12" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="18" cy="18" r="2"/>
      <path d="m8 11 8-4M8 13l8 4"/>
    </symbol>
    <symbol id="i-command" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M12 15h5"/>
    </symbol>
    <symbol id="i-chevron-up" viewBox="0 0 24 24">
      <path d="m6 15 6-6 6 6"/>
    </symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24">
      <path d="m6 9 6 6 6-6"/>
    </symbol>
    <symbol id="i-new" viewBox="0 0 24 24">
      <path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M12 11v6M9 14h6"/>
    </symbol>
    <symbol id="i-open" viewBox="0 0 24 24">
      <path d="M3 7h7l2 2h9v10H3z"/><path d="M3 7V5h6l2 2"/>
    </symbol>
    <symbol id="i-print" viewBox="0 0 24 24">
      <path d="M7 8V3h10v5"/><rect x="4" y="8" width="16" height="8" rx="1"/><path d="M7 16h10v5H7z"/>
    </symbol>
    <symbol id="i-properties" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>
    </symbol>
  </svg>

  <div id="app" class="app">
    <!-- Title Bar / Quick Access Toolbar -->
    <header class="title-bar">
      <div class="title-bar__left">
        <div class="app-badge" title="WordPad Lite">W</div>
        <div class="qat" aria-label="クイック アクセス ツール バー">
          <button id="qat-save" class="icon-btn" title="保存 (Ctrl+S)">
            <svg class="icon"><use href="#i-save"></use></svg>
          </button>
          <button id="qat-undo" class="icon-btn" title="元に戻す (Ctrl+Z)">
            <svg class="icon"><use href="#i-undo"></use></svg>
          </button>
          <button id="qat-redo" class="icon-btn" title="やり直し (Ctrl+Y)">
            <svg class="icon"><use href="#i-redo"></use></svg>
          </button>
        </div>
        <span class="title-bar__app">WordPad Lite</span>
      </div>
      <span class="title-bar__text">無題 — WordPad Lite</span>
      <div class="title-bar__right">
        <button id="btn-search" class="icon-btn" title="検索 (Ctrl+F)">
          <svg class="icon"><use href="#i-search"></use></svg>
        </button>
        <button id="btn-share" class="icon-btn" title="共有">
          <svg class="icon"><use href="#i-share"></use></svg>
        </button>
        <div class="window-controls">
          <button id="btn-minimize" class="window-btn" aria-label="最小化" title="ブラウザ版では利用できません" disabled>&#8212;</button>
          <button id="btn-maximize" class="window-btn" aria-label="最大化">&#9633;</button>
          <button id="btn-close" class="window-btn close" aria-label="閉じる">&#10005;</button>
        </div>
      </div>
    </header>

    <!-- Ribbon -->
    <nav class="ribbon" id="ribbon" aria-label="リボン">
      <div class="ribbon-top">
        <button class="ribbon-tab file-tab" data-tab="file">
          <svg class="icon"><use href="#i-file"></use></svg>
          <span>ファイル</span>
        </button>
        <div class="ribbon-tabs">
          <button class="ribbon-tab active" data-tab="home">ホーム</button>
          <button class="ribbon-tab" data-tab="insert">挿入</button>
          <button class="ribbon-tab" data-tab="layout">レイアウト</button>
          <button class="ribbon-tab" data-tab="view">表示</button>
        </div>
        <div class="ribbon-tools">
          <button id="btn-command-palette" class="ribbon-tool" title="コマンド パレット (Ctrl+K)">
            <svg class="icon"><use href="#i-command"></use></svg>
            <span>コマンド</span>
          </button>
          <button id="btn-ribbon-collapse" class="ribbon-tool" title="リボンの折りたたみ">
            <svg class="icon"><use href="#i-chevron-up"></use></svg>
          </button>
        </div>
      </div>

      <div class="ribbon-panel">
        <!-- Home -->
        <section class="ribbon-page active" data-page="home">
          <div class="ribbon-group">
            <div class="ribbon-group-content">
              <button class="ribbon-btn large" data-cmd="paste" title="貼り付け (Ctrl+V)">
                <svg class="icon"><use href="#i-paste"></use></svg>
                <span class="ribbon-btn-label">貼り付け</span>
              </button>
              <div class="ribbon-stack">
                <button class="ribbon-btn" data-cmd="cut" title="切り取り (Ctrl+X)">
                  <svg class="icon"><use href="#i-cut"></use></svg>
                </button>
                <button class="ribbon-btn" data-cmd="copy" title="コピー (Ctrl+C)">
                  <svg class="icon"><use href="#i-copy"></use></svg>
                </button>
              </div>
            </div>
            <span class="ribbon-group-label">クリップボード</span>
          </div>

          <div class="ribbon-group">
            <div class="ribbon-group-content vertical">
              <div class="ribbon-row">
                <select id="font-family" class="ribbon-select font-select" title="フォント">
                  <option value="Meiryo UI">Meiryo UI</option>
                  <option value="Yu Gothic UI">Yu Gothic UI</option>
                  <option value="MS Gothic">MS Gothic</option>
                  <option value="Segoe UI">Segoe UI</option>
                  <option value="Arial">Arial</option>
                  <option value="Times New Roman">Times New Roman</option>
                  <option value="Consolas">Consolas</option>
                </select>
                <select id="font-size" class="ribbon-select narrow" title="サイズ (pt)">
                  <option value="8">8</option>
                  <option value="9">9</option>
                  <option value="10">10</option>
                  <option value="11" selected>11</option>
                  <option value="12">12</option>
                  <option value="14">14</option>
                  <option value="16">16</option>
                  <option value="18">18</option>
                  <option value="20">20</option>
                  <option value="24">24</option>
                  <option value="28">28</option>
                  <option value="36">36</option>
                  <option value="48">48</option>
                  <option value="72">72</option>
                </select>
              </div>
              <div class="ribbon-row">
                <button class="ribbon-btn" data-cmd="bold" title="太字 (Ctrl+B)">
                  <svg class="icon"><use href="#i-bold"></use></svg>
                </button>
                <button class="ribbon-btn" data-cmd="italic" title="斜体 (Ctrl+I)">
                  <svg class="icon"><use href="#i-italic"></use></svg>
                </button>
                <button class="ribbon-btn" data-cmd="underline" title="下線 (Ctrl+U)">
                  <svg class="icon"><use href="#i-underline"></use></svg>
                </button>
                <button class="ribbon-btn" data-cmd="strikeThrough" title="取り消し線">
                  <svg class="icon"><use href="#i-strike"></use></svg>
                </button>
                <label class="color-btn" title="文字色">
                  <input type="color" id="font-color" value="#1a1a1a" />
                  <svg class="icon"><use href="#i-font-color"></use></svg>
                </label>
                <label class="color-btn" title="背景色">
                  <input type="color" id="back-color" value="#ffffff" />
                  <svg class="icon"><use href="#i-highlight"></use></svg>
                </label>
                <button class="ribbon-btn" data-cmd="removeFormat" title="書式のクリア">
                  <svg class="icon"><use href="#i-eraser"></use></svg>
                </button>
              </div>
            </div>
            <span class="ribbon-group-label">フォント</span>
          </div>

          <div class="ribbon-group">
            <div class="ribbon-group-content vertical">
              <div class="ribbon-row">
                <button class="ribbon-btn" data-cmd="justifyLeft" title="左揃え (Ctrl+L)">
                  <svg class="icon"><use href="#i-align-left"></use></svg>
                </button>
                <button class="ribbon-btn" data-cmd="justifyCenter" title="中央揃え (Ctrl+E)">
                  <svg class="icon"><use href="#i-align-center"></use></svg>
                </button>
                <button class="ribbon-btn" data-cmd="justifyRight" title="右揃え (Ctrl+R)">
                  <svg class="icon"><use href="#i-align-right"></use></svg>
                </button>
                <button class="ribbon-btn" data-cmd="justifyFull" title="両端揃え (Ctrl+J)">
                  <svg class="icon"><use href="#i-align-justify"></use></svg>
                </button>
                <select class="ribbon-select line-spacing-select" title="行間隔">
                  <option value="1.0">1.0</option>
                  <option value="1.15" selected>1.15</option>
                  <option value="1.5">1.5</option>
                  <option value="2.0">2.0</option>
                </select>
              </div>
              <div class="ribbon-row">
                <button class="ribbon-btn" data-cmd="insertUnorderedList" title="箇条書き">
                  <svg class="icon"><use href="#i-bullets"></use></svg>
                </button>
                <button class="ribbon-btn" data-cmd="insertOrderedList" title="番号付け">
                  <svg class="icon"><use href="#i-numbering"></use></svg>
                </button>
                <button class="ribbon-btn" data-cmd="indent" title="インデント増">
                  <svg class="icon"><use href="#i-indent"></use></svg>
                </button>
                <button class="ribbon-btn" data-cmd="outdent" title="インデント減">
                  <svg class="icon"><use href="#i-outdent"></use></svg>
                </button>
              </div>
              <div class="ribbon-row paragraph-spacing-row">
                <label class="ribbon-field-label" for="paragraph-before">前</label>
                <input type="number" id="paragraph-before" class="margin-input" min="0" max="72" step="1" value="0" title="段落前の間隔 (pt)" />
                <label class="ribbon-field-label" for="paragraph-after">後</label>
                <input type="number" id="paragraph-after" class="margin-input" min="0" max="72" step="1" value="0" title="段落後の間隔 (pt)" />
              </div>
            </div>
            <span class="ribbon-group-label">段落</span>
          </div>

          <div class="ribbon-group styles-group">
            <div class="ribbon-group-content styles-content">
              <button class="style-btn" data-style="p">
                <span class="style-preview style-preview--normal">Aa</span>
                <span>標準</span>
              </button>
              <button class="style-btn" data-style="h1">
                <span class="style-preview style-preview--h1">Aa</span>
                <span>見出し 1</span>
              </button>
              <button class="style-btn" data-style="h2">
                <span class="style-preview style-preview--h2">Aa</span>
                <span>見出し 2</span>
              </button>
            </div>
            <span class="ribbon-group-label">スタイル</span>
          </div>

          <div class="ribbon-group">
            <div class="ribbon-group-content vertical">
              <button class="ribbon-btn wide" id="btn-find" title="検索 (Ctrl+F)">
                <svg class="icon"><use href="#i-search"></use></svg>
                <span>検索</span>
              </button>
              <button class="ribbon-btn wide" id="btn-replace" title="置換 (Ctrl+H)">
                <svg class="icon"><use href="#i-command"></use></svg>
                <span>置換</span>
              </button>
              <button class="ribbon-btn wide" data-cmd="selectAll" title="すべて選択 (Ctrl+A)">
                <span class="ribbon-btn-text">すべて選択</span>
              </button>
            </div>
            <span class="ribbon-group-label">編集</span>
          </div>
        </section>

        <!-- Insert -->
        <section class="ribbon-page" data-page="insert">
          <div class="ribbon-group">
            <div class="ribbon-group-content">
              <button class="ribbon-btn large" id="btn-insert-pagebreak" title="改ページ">
                <svg class="icon"><use href="#i-page-break"></use></svg>
                <span class="ribbon-btn-label">改ページ</span>
              </button>
              <button class="ribbon-btn large" id="btn-insert-blankpage" title="空白のページ">
                <svg class="icon"><use href="#i-blank-page"></use></svg>
                <span class="ribbon-btn-label">空白ページ</span>
              </button>
            </div>
            <span class="ribbon-group-label">ページ</span>
          </div>

          <div class="ribbon-group">
            <div class="ribbon-group-content">
              <button class="ribbon-btn" id="btn-insert-table" title="テーブル挿入">
                <svg class="icon"><use href="#i-table"></use></svg>
              </button>
              <div id="table-picker" class="table-picker" tabindex="0">
                <div class="table-picker-grid"></div>
                <span class="table-picker-label">1 × 1</span>
              </div>
            </div>
            <span class="ribbon-group-label">テーブル</span>
          </div>

          <div class="ribbon-group">
            <div class="ribbon-group-content">
              <button class="ribbon-btn large" id="btn-insert-image" title="画像 URL を挿入">
                <svg class="icon"><use href="#i-image"></use></svg>
                <span class="ribbon-btn-label">画像</span>
              </button>
              <button class="ribbon-btn large" id="btn-insert-image-file" title="画像ファイルを挿入">
                <svg class="icon"><use href="#i-image"></use></svg>
                <span class="ribbon-btn-label">ファイル</span>
              </button>
            </div>
            <span class="ribbon-group-label">図</span>
          </div>

          <div class="ribbon-group">
            <div class="ribbon-group-content">
              <button class="ribbon-btn large" id="btn-insert-link" title="リンク挿入">
                <svg class="icon"><use href="#i-link"></use></svg>
                <span class="ribbon-btn-label">リンク</span>
              </button>
            </div>
            <span class="ribbon-group-label">リンク</span>
          </div>
        </section>

        <!-- Layout -->
        <section class="ribbon-page" data-page="layout">
          <div class="ribbon-group">
            <div class="ribbon-group-content vertical">
              <div class="ribbon-row">
                <label class="ribbon-field-label">サイズ</label>
                <select id="page-size" class="ribbon-select">
                  <option value="A4">A4</option>
                  <option value="B5">B5</option>
                  <option value="Letter">Letter</option>
                  <option value="Legal">Legal</option>
                </select>
                <label class="ribbon-field-label">向き</label>
                <select id="page-orientation" class="ribbon-select">
                  <option value="portrait">縦</option>
                  <option value="landscape">横</option>
                </select>
              </div>
              <div class="ribbon-row margins-row">
                <label>上 <input type="number" id="margin-top" class="margin-input" min="1" max="50" step="1" value="25" /></label>
                <label>下 <input type="number" id="margin-bottom" class="margin-input" min="1" max="50" step="1" value="25" /></label>
                <label>左 <input type="number" id="margin-left" class="margin-input" min="1" max="50" step="1" value="25" /></label>
                <label>右 <input type="number" id="margin-right" class="margin-input" min="1" max="50" step="1" value="25" /></label>
              </div>
            </div>
            <span class="ribbon-group-label">ページ設定</span>
          </div>

          <div class="ribbon-group">
            <div class="ribbon-group-content vertical">
              <div class="ribbon-row">
                <input type="text" id="header-text" class="header-footer-input" placeholder="ヘッダー" aria-label="ヘッダー" />
                <input type="text" id="footer-text" class="header-footer-input" placeholder="フッター" aria-label="フッター" />
              </div>
              <div class="ribbon-row">
                <label class="toggle">
                  <input type="checkbox" id="footer-page-number" />
                  <span>ページ番号</span>
                </label>
              </div>
            </div>
            <span class="ribbon-group-label">ヘッダー / フッター</span>
          </div>

          <div class="ribbon-group">
            <div class="ribbon-group-content vertical">
              <div class="ribbon-row">
                <button class="ribbon-btn" data-cmd="indent" title="インデント増">
                  <svg class="icon"><use href="#i-indent"></use></svg>
                </button>
                <button class="ribbon-btn" data-cmd="outdent" title="インデント減">
                  <svg class="icon"><use href="#i-outdent"></use></svg>
                </button>
                <select class="ribbon-select line-spacing-select" title="行間隔">
                  <option value="1.0">1.0</option>
                  <option value="1.15" selected>1.15</option>
                  <option value="1.5">1.5</option>
                  <option value="2.0">2.0</option>
                </select>
              </div>
              <div class="ribbon-row">
                <button class="ribbon-btn" data-cmd="insertUnorderedList" title="箇条書き">
                  <svg class="icon"><use href="#i-bullets"></use></svg>
                </button>
                <button class="ribbon-btn" data-cmd="insertOrderedList" title="番号付け">
                  <svg class="icon"><use href="#i-numbering"></use></svg>
                </button>
              </div>
            </div>
            <span class="ribbon-group-label">段落</span>
          </div>
        </section>

        <!-- View -->
        <section class="ribbon-page" data-page="view">
          <div class="ribbon-group">
            <div class="ribbon-group-content vertical">
              <button class="ribbon-btn wide" id="btn-read-mode" title="読書モード">
                <svg class="icon"><use href="#i-read"></use></svg>
                <span>読書モード</span>
              </button>
              <span class="ribbon-hint">ページ レイアウト</span>
            </div>
            <span class="ribbon-group-label">表示</span>
          </div>

          <div class="ribbon-group">
            <div class="ribbon-group-content vertical">
              <label class="toggle">
                <input type="checkbox" id="show-ruler" checked />
                <svg class="icon"><use href="#i-ruler"></use></svg>
                <span>定規</span>
              </label>
              <label class="toggle">
                <input type="checkbox" id="show-marks" />
                <svg class="icon"><use href="#i-marks"></use></svg>
                <span>改行記号</span>
              </label>
            </div>
            <span class="ribbon-group-label">表示</span>
          </div>

          <div class="ribbon-group">
            <div class="ribbon-group-content vertical">
              <div class="ribbon-row">
                <button class="ribbon-btn" id="zoom-out" title="縮小">
                  <svg class="icon"><use href="#i-zoom-out"></use></svg>
                </button>
                <button class="ribbon-btn wide" id="zoom-reset" title="100%">100%</button>
                <button class="ribbon-btn" id="zoom-in" title="拡大">
                  <svg class="icon"><use href="#i-zoom-in"></use></svg>
                </button>
              </div>
              <input type="range" id="zoom-slider" min="50" max="200" value="100" />
            </div>
            <span class="ribbon-group-label">ズーム</span>
          </div>

          <div class="ribbon-group">
            <div class="ribbon-group-content vertical">
              <label class="toggle">
                <input type="radio" name="theme" value="light" />
                <svg class="icon"><use href="#i-sun"></use></svg>
                <span>ライト</span>
              </label>
              <label class="toggle">
                <input type="radio" name="theme" value="dark" />
                <svg class="icon"><use href="#i-moon"></use></svg>
                <span>ダーク</span>
              </label>
              <label class="toggle">
                <input type="radio" name="theme" value="system" checked />
                <span>システム</span>
              </label>
            </div>
            <span class="ribbon-group-label">テーマ</span>
          </div>
        </section>

        <!-- File -->
        <section class="ribbon-page" data-page="file">
          <div class="ribbon-group">
            <div class="ribbon-group-content">
              <button class="ribbon-btn large" id="file-new" title="新規 (Ctrl+N)">
                <svg class="icon"><use href="#i-new"></use></svg>
                <span class="ribbon-btn-label">新規</span>
              </button>
              <button class="ribbon-btn large" id="file-open" title="開く (Ctrl+O)">
                <svg class="icon"><use href="#i-open"></use></svg>
                <span class="ribbon-btn-label">開く</span>
              </button>
              <button class="ribbon-btn large" id="file-save" title="保存 (Ctrl+S)">
                <svg class="icon"><use href="#i-save"></use></svg>
                <span class="ribbon-btn-label">保存</span>
              </button>
              <button class="ribbon-btn large" id="file-save-as" title="名前を付けて保存">
                <svg class="icon"><use href="#i-save-as"></use></svg>
                <span class="ribbon-btn-label">名前を付けて保存</span>
              </button>
              <button class="ribbon-btn large" id="file-export-docx" title="DOCX として書き出す">
                <svg class="icon"><use href="#i-file"></use></svg>
                <span class="ribbon-btn-label">DOCX</span>
              </button>
              <button class="ribbon-btn large" id="file-export-pdf" title="PDF として書き出す">
                <svg class="icon"><use href="#i-file"></use></svg>
                <span class="ribbon-btn-label">PDF</span>
              </button>
              <button class="ribbon-btn large" id="file-print" title="印刷 (Ctrl+P)">
                <svg class="icon"><use href="#i-print"></use></svg>
                <span class="ribbon-btn-label">印刷</span>
              </button>
            </div>
            <span class="ribbon-group-label">操作</span>
          </div>

          <div class="ribbon-group">
            <div class="ribbon-group-content">
              <button class="ribbon-btn large" id="file-properties" title="プロパティ">
                <svg class="icon"><use href="#i-properties"></use></svg>
                <span class="ribbon-btn-label">プロパティ</span>
              </button>
            </div>
            <span class="ribbon-group-label">情報</span>
          </div>
        </section>
      </div>
    </nav>

    <!-- Editor Viewport -->
    <main class="editor-viewport">
      <div class="ruler ruler--horizontal" id="ruler-h"></div>
      <div class="ruler ruler--vertical" id="ruler-v"></div>
      <div class="editor-scroll" id="editor-scroll">
        <div class="page" id="page">
          <div class="page-header" id="page-header" aria-hidden="true"></div>
          <div id="editor" class="editor" contenteditable="true" spellcheck="false">
            <p>WordPad Lite へようこそ。</p>
            <p>ここから文章を入力できます。</p>
          </div>
          <div class="page-footer" id="page-footer" aria-hidden="true">
            <span id="page-footer-text"></span>
            <span id="page-footer-number"></span>
          </div>
        </div>
      </div>
    </main>

    <!-- Status Bar -->
    <footer class="status-bar">
      <div class="status-left">
        <span id="status-page">ページ 1 / 1</span>
        <span id="status-line">行 1</span>
        <span id="status-char">文字数 0</span>
        <span id="status-sel">選択 0文字</span>
      </div>
      <div class="status-center" id="ime-status">日本語</div>
      <div class="status-right">
        <button class="status-btn" id="status-zoom-out" title="縮小">&#8722;</button>
        <span id="status-zoom-text">100%</span>
        <button class="status-btn" id="status-zoom-in" title="拡大">&#43;</button>
        <input type="range" id="status-zoom-slider" min="50" max="200" value="100" />
      </div>
    </footer>

    <!-- Command Palette -->
    <div class="overlay" id="command-palette" role="dialog" aria-modal="true" aria-label="コマンド パレット" hidden>
      <div class="palette">
        <input type="text" id="palette-input" placeholder="コマンドを検索..." autocomplete="off" />
        <ul id="palette-list"></ul>
      </div>
    </div>

    <!-- Find/Replace -->
    <div class="overlay" id="find-dialog" role="dialog" aria-modal="true" aria-label="検索と置換" hidden>
      <div class="dialog">
        <h3>検索と置換</h3>
        <label>検索 <input type="text" id="find-text" /></label>
        <label>置換 <input type="text" id="replace-text" /></label>
        <div class="dialog-options">
          <label><input type="checkbox" id="find-case" /> 大文字小文字を区別</label>
        </div>
        <div class="dialog-actions">
          <button id="find-next">次を検索</button>
          <button id="replace-one">置換</button>
          <button id="replace-all">すべて置換</button>
          <button id="find-close">閉じる</button>
        </div>
      </div>
    </div>

    <!-- Link dialog -->
    <div class="overlay" id="link-dialog" role="dialog" aria-modal="true" aria-label="リンク挿入" hidden>
      <div class="dialog small">
        <h3>リンクを挿入</h3>
        <label>URL <input type="text" id="link-url" placeholder="https://..." /></label>
        <div class="dialog-actions">
          <button id="link-ok" class="primary">OK</button>
          <button id="link-cancel">キャンセル</button>
        </div>
      </div>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="file-input" accept=".txt,.html,.htm,.md,.markdown,.rtf,.docx,.pdf" hidden />
    <input type="file" id="image-input" accept="image/png,image/jpeg,image/gif,image/svg+xml,image/webp" hidden />

    <button id="btn-exit-read" class="exit-read-btn" title="読書モードを終了 (Esc)">読書モードを終了</button>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
